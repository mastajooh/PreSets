name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (dev files the SDK compiles against)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build GearsetGallery/GearsetGallery.csproj -c Release

      - name: Collect plugin zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = Get-ChildItem -Recurse -Path GearsetGallery/bin -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager did not produce latest.zip" }
          Copy-Item $zip.FullName dist/latest.zip
          Expand-Archive -Force dist/latest.zip dist/GearsetGallery

      - uses: actions/upload-artifact@v4
        with:
          name: GearsetGallery
          path: dist/GearsetGallery/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latest.zip
